<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Boleh Beli Ke?</title>
<style>
:root{
  color-scheme:light;
  --bg:#ffffff; --ink:#111827; --muted:#566070; --line:#e6eaf1; --soft:#f4f6fb;
  --green:#16794a; --green-bg:#e6f6ed; --green-l:#7fd0a3;
  --amber:#9a5a05; --amber-bg:#fff3dc; --amber-l:#f3c46a;
  --red:#b42323; --red-bg:#fdeaea; --red-l:#ec8f8f;
  --brand:#0f3d91; --brand-bg:#eaf0fc;
  --shadow:0 2px 10px rgba(15,35,80,.07);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%;}
.wrap{max-width:520px;margin:0 auto;padding:10px 18px 44px;}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 12px;}
.brand{font-weight:800;color:var(--brand);font-size:21px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;}
.brand .mk{width:32px;height:32px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;box-shadow:var(--shadow);}
.seg button{border:0;background:#fff;padding:9px 14px;font-size:15px;font-weight:800;color:var(--muted);}
.seg button.on{background:var(--brand);color:#fff;}
.demo{background:var(--amber-bg);color:var(--amber);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:15px;font-weight:700;}
.demo button{display:block;margin-top:8px;border:0;background:var(--amber);color:#fff;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:800;}
h1{font-size:32px;line-height:1.12;margin:6px 0 8px;letter-spacing:-.6px;}
h2{font-size:25px;line-height:1.2;margin:8px 0 10px;letter-spacing:-.3px;}
p{margin:0 0 12px;}
.lead{font-size:19px;color:var(--muted);}
.hero{text-align:center;padding:14px 0 6px;}
.hero .logo{width:76px;height:76px;margin:0 auto 10px;border-radius:24px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 8px 24px rgba(15,61,145,.25);}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px;}
.how div{background:var(--soft);border-radius:16px;padding:14px 8px;text-align:center;font-size:14px;font-weight:700;line-height:1.25;}
.how div b{display:block;font-size:30px;margin-bottom:4px;}
.card{border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px;background:#fff;box-shadow:var(--shadow);}
.soft{background:var(--soft);box-shadow:none;}
.hint{font-size:15px;color:var(--muted);margin-top:6px;}
.lb{display:block;font-size:17px;font-weight:800;margin:16px 0 6px;}
.money{display:flex;align-items:center;border:2px solid #c5ccd8;border-radius:14px;background:#fff;}
.money:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px #c4d5f6;}
.money span{padding:0 4px 0 14px;font-weight:800;color:var(--muted);font-size:20px;}
.money input{border:0;outline:0;flex:1;min-width:0;font:inherit;font-size:25px;font-weight:800;padding:13px 12px 13px 4px;background:transparent;color:var(--ink);}
.txt{width:100%;font:inherit;font-size:18px;padding:13px;border:2px solid #c5ccd8;border-radius:14px;background:#fff;color:var(--ink);}
.txt:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px #c4d5f6;}
textarea.txt{min-height:80px;font-size:16px;}
button.primary{display:block;width:100%;margin-top:14px;padding:17px;font-size:19px;font-weight:800;border:0;border-radius:16px;background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(15,61,145,.25);}
button.primary:disabled{opacity:.45;}
button.second{display:block;width:100%;margin-top:10px;padding:15px;font-size:18px;font-weight:800;border:2px solid var(--brand);border-radius:16px;background:#fff;color:var(--brand);}
button.link{display:block;margin:12px auto 0;border:0;background:transparent;color:var(--brand);font-size:17px;font-weight:700;text-decoration:underline;padding:8px;}
button.back{border:0;background:transparent;color:var(--brand);font-size:17px;font-weight:800;padding:8px 0;}
button.del{border:0;background:transparent;color:var(--red);font-weight:700;font-size:15px;padding:8px 0 0;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chips button{border:2px solid #c5ccd8;background:#fff;border-radius:999px;padding:11px 16px;font-size:17px;font-weight:700;color:var(--ink);}
.chips button.on{border-color:var(--brand);background:var(--brand-bg);color:var(--brand);}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.tile{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 4px 10px;text-align:center;font-size:13px;font-weight:700;line-height:1.2;color:var(--ink);}
.tile .em{display:block;font-size:30px;margin-bottom:4px;}
.tile.on{border-color:var(--brand);background:var(--brand-bg);color:var(--brand);box-shadow:0 0 0 3px #c4d5f6;}
.steps{display:flex;gap:6px;margin:6px 0 2px;}
.steps i{flex:1;height:7px;border-radius:99px;background:var(--line);}
.steps i.on{background:var(--brand);}
.nav{display:flex;gap:10px;margin-top:14px;align-items:stretch;}
.nav button.primary{flex:1;width:auto;margin-top:0;}
button.arrow{flex:none;width:68px;padding:12px 0;font-size:28px;line-height:1;font-weight:800;border:2px solid var(--brand);border-radius:16px;background:#fff;color:var(--brand);}
button.arrow:active{background:var(--brand-bg);}
button.arrow:disabled{opacity:.28;}
.gnav{display:flex;justify-content:space-between;margin:0 0 12px;}
.gnav button.arrow{width:70px;padding:7px 0;font-size:26px;}
.err{color:var(--red);font-weight:800;font-size:16px;margin-top:8px;}
.verdict{border-radius:20px;padding:18px 16px 14px;margin:0 0 14px;}
.verdict.green{background:linear-gradient(180deg,var(--green-bg),#f6fcf9);}
.verdict.amber{background:linear-gradient(180deg,var(--amber-bg),#fffaf0);}
.verdict.red{background:linear-gradient(180deg,var(--red-bg),#fff6f6);}
.verdict .vt{font-size:27px;font-weight:800;line-height:1.15;}
.verdict.green .vt{color:var(--green);} .verdict.amber .vt{color:var(--amber);} .verdict.red .vt{color:var(--red);}
.verdict .vs{font-size:17px;margin-top:8px;color:var(--ink);}
.gauge{width:100%;max-width:300px;margin:6px auto 0;display:block;}
.gl{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:2px;}
.gl i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;}
.bigl{font-size:16px;color:var(--muted);font-weight:700;}
.bign{font-size:42px;font-weight:800;letter-spacing:-1.2px;line-height:1.1;}
.flex{display:flex;align-items:center;gap:14px;}
.donut{width:112px;height:112px;flex:none;}
.legend{flex:1;min-width:0;}
.lg{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:14.5px;}
.lg i{width:12px;height:12px;border-radius:4px;flex:none;}
.lg span{flex:1;min-width:0;}
.lg b{white-space:nowrap;}
.lg small{color:var(--muted);font-weight:600;margin-left:4px;}
.stack{display:flex;height:18px;border-radius:99px;overflow:hidden;background:var(--line);margin:10px 0 8px;}
.stack span{display:block;height:100%;}
.sec{font-size:19px;font-weight:800;margin:0 0 8px;}
.row2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.item:last-child{border-bottom:0;}
.badge{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;flex:none;}
.item .mid{flex:1;min-width:0;}
.item .r1{display:flex;justify-content:space-between;gap:10px;font-weight:800;font-size:18px;}
.item small{display:block;color:var(--muted);font-size:14.5px;margin-top:2px;}
.grp{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 2px;font-weight:800;font-size:17px;}
.grp:first-child{margin-top:0;}
.grp span:last-child,.item .r1 span:last-child,.row2 b{white-space:nowrap;}
.empty{color:var(--muted);padding:6px 0;}
.emptybox{text-align:center;padding:10px 0 4px;}
.emptybox .big{font-size:46px;}
ul.signs{margin:8px 0 0;padding-left:22px;}
ul.signs li{margin:6px 0;}
.hidden{display:none;}
footer{margin-top:22px;font-size:13px;color:var(--muted);text-align:center;}
a{color:var(--brand);font-weight:700;}
</style>
</head>

  function gauge(pct){
    var cx=100,cy=100,r=78,sw=18;
    function pt(p,rad){var a=Math.PI*(1-p/50);return [cx+rad*Math.cos(a),cy-rad*Math.sin(a)];}
    function arc(p1,p2,col){var a=pt(p1,r),b=pt(p2,r);
      return '<path d="M'+a[0].toFixed(2)+' '+a[1].toFixed(2)+' A'+r+' '+r+' 0 0 1 '+b[0].toFixed(2)+' '+b[1].toFixed(2)+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'"/>';}
    var p=Math.min(Math.max(pct,0),50), tip=pt(p,r-8);
    var svg='<svg class="gauge" viewBox="0 0 200 132" role="img" aria-label="'+esc(pctTxt(pct))+'%">'+
      arc(0,AMBER_PCT,"#7fd0a3")+arc(AMBER_PCT,RED_PCT,"#f3c46a")+arc(RED_PCT,50,"#ec8f8f")+
      '<line x1="'+cx+'" y1="'+cy+'" x2="'+tip[0].toFixed(2)+'" y2="'+tip[1].toFixed(2)+'" stroke="#111827" stroke-width="5" stroke-linecap="round"/>'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="8" fill="#111827"/>'+
      '<text x="18" y="119" font-size="11" fill="#566070" font-weight="700">0%</text>'+
      '<text x="182" y="119" font-size="11" fill="#566070" font-weight="700" text-anchor="end">50%+</text>'+

    return svg+lg;

  function donut(segs,cTop,cBot,botColor){
    var total=0;segs.forEach(function(s){total+=Math.max(s.v,0);});
    var R=15.91549,off=25,h='<svg class="donut" viewBox="0 0 42 42" role="img"><circle cx="21" cy="21" r="'+R+'" fill="none" stroke="#e6eaf1" stroke-width="6"/>';
    if(total>0){segs.forEach(function(s){
      if(s.v<=0)return;var len=s.v/total*100;
      h+='<circle cx="21" cy="21" r="'+R+'" fill="none" stroke="'+s.c+'" stroke-width="6" stroke-dasharray="'+len.toFixed(3)+' '+(100-len).toFixed(3)+'" stroke-dashoffset="'+off.toFixed(3)+'"/>';
      off-=len;});}
    h+='<text x="21" y="19.4" text-anchor="middle" font-size="3.4" fill="#566070" font-weight="700">'+esc(cTop)+'</text>'+
       '<text x="21" y="25" text-anchor="middle" font-size="4.3" font-weight="800" fill="'+(botColor||"#111827")+'">'+esc(cBot)+'</text></svg>';
    return h;
  }
  function stackBar(groups){
    var total=0;groups.forEach(function(g){total+=g.total;});

  }

  function nextDueDays(day){
    var now=new Date(),y=now.getFullYear(),m=now.getMonth(),d=now.getDate();
    function dim(yy,mm){return new Date(yy,mm+1,0).getDate();}
    var t=Math.min(day,dim(y,m));
    if(t<d){m+=1;if(m>11){m=0;y+=1;}t=Math.min(day,dim(y,m));}
    var a=new Date(now.getFullYear(),now.getMonth(),now.getDate()),b=new Date(y,m,t);
    return Math.round((b-a)/86400000);
  }
  function armConfirm(btn,action){

    h+='<div class="card"><div class="bigl">'+esc(T("plansTotal"))+'</div><div class="bign">'+esc(fmt(c.load))+'</div>'+
      '<div class="hint">'+esc(pctTxt(c.pct))+'% '+esc(T("ofIncome"))+'</div>'+
      '<div class="flex" style="margin-top:12px">'+donut(segs,T("perMonth"),fmt(c.load))+
      '<div class="legend">'+groups.map(function(g){var k=catOf(g.id),p=c.load>0?Math.round(g.total/c.load*100):0;
        return '<div class="lg"><i style="background:'+k.c+'"></i><span>'+k.e+' '+esc(catName(g.id))+'</span><b>'+p+'%</b></div>';}).join("")+'</div></div></div>';
    h+='<button class="primary" id="addBtn" type="button" style="margin-top:0">'+esc(T("addInst"))+'</button>';
    h+='<div class="sec" style="margin-top:18px">'+esc(T("byProduct"))+'</div><div class="card">';
    var first=true;
    groups.forEach(function(g){
      var k=catOf(g.id);
      h+='<div class="grp" style="'+(first?"margin-top:0":"")+'"><span>'+k.e+' '+esc(catName(g.id))+'</span><span>'+esc(fmt(g.total))+'</span></div>';
      first=false;
      S.items.forEach(function(i,x){if(catOf(i.cat).id===g.id)h+=planRow(i,x,true);});
    });
    h+='</div>';
    return h;
  };
  W.plans=function(){
    wireDeletes($("app"));
    if($("backTop"))$("backTop").onclick=function(){go("home");};
    $("addBtn").onclick=function(){addPrefill=null;returnTo="plans";go("add");};
  };

  // Add instalment
  var addCat="",addProvider="",addPrefill=null;
  V.add=function(){
    var pre=addPrefill||{};addCat="";addProvider="";
    return '<button class="back" id="cancelTop" type="button">'+esc(T("back"))+'</button><h2>'+esc(T("addTitle"))+'</h2>'+
      '<label class="lb" style="margin-top:4px">'+esc(T("whatFor"))+'</label><div class="tiles" id="tiles">'+
      CATS.map(function(k){return '<button type="button" class="tile" data-c="'+k.id+'"><span class="em">'+k.e+'</span>'+esc(catName(k.id))+'</button>';}).join("")+'</div>'+
      '<label class="lb" for="aName">'+esc(T("nameOpt"))+'</label><input class="txt" id="aName" type="text" maxlength="40" placeholder="'+esc(T("namePh"))+'">'+
      moneyField("aMonthly",T("howMuch"),pre.monthly||"","150")+
      '<label class="lb">'+esc(T("paidThrough"))+'</label><div class="chips" id="chips">'+
      PROVIDERS.concat(["__other"]).map(function(p){return '<button type="button" data-p="'+(p==="__other"?"":p)+'">'+esc(p==="__other"?T("other_p"):p)+'</button>';}).join("")+'</div>'+
      '<label class="lb" for="aMonths">'+esc(T("howLong"))+' <span style="font-weight:500;color:var(--muted)">('+esc(T("howLongH"))+')</span></label><input class="txt" id="aMonths" type="number" inputmode="numeric" min="1" max="60" placeholder="6" value="'+(pre.months||"")+'">'+
      '<label class="lb" for="aDay">'+esc(T("whichDay"))+'</label><input class="txt" id="aDay" type="number" inputmode="numeric" min="1" max="31" placeholder="15"><div class="hint">'+esc(T("whichDayH"))+'</div>'+
      '<div class="err" id="err"></div>'+
      '<button class="primary" id="saveBtn" type="button">'+esc(T("save"))+'</button>'+
      '<button class="link" id="pasteLink" type="button">'+esc(T("pasteLink"))+'</button>'+
      '<div id="pasteBox" class="hidden"><textarea class="txt" id="paste" placeholder="SPayLater: RM85.50 due 15/11"></textarea>'+
      '<button class="second" id="pasteBtn" type="button">'+esc(T("pasteBtn"))+'</button><div class="hint" id="pasteNote"></div></div>';
  };
  W.add=function(){
    addPrefill=null;
    $("cancelTop").onclick=function(){go(returnTo);};
    $("tiles").querySelectorAll("button").forEach(function(b){
      b.onclick=function(){
        $("tiles").querySelectorAll("button").forEach(function(x){x.classList.remove("on");});
        b.classList.add("on");addCat=b.getAttribute("data-c");$("err").textContent="";
      };
    });
    $("chips").querySelectorAll("button").forEach(function(b){
      b.onclick=function(){
        $("chips").querySelectorAll("button").forEach(function(x){x.classList.remove("on");});
        b.classList.add("on");addProvider=b.getAttribute("data-p");
      };
    });
    $("pasteLink").onclick=function(){$("pasteBox").classList.toggle("hidden");};
    $("pasteBtn").onclick=function(){
      var r=parseText($("paste").value||"");
      if(!r.monthly){$("pasteNote").textContent=T("pasteFail");return;}
      $("aMonthly").value=r.monthly;
      if(r.dueDay)$("aDay").value=r.dueDay;
      if(r.provider){addProvider=r.provider;$("chips").querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x.getAttribute("data-p")===r.provider);});}
      $("pasteNote").textContent=T("pasteOk");
    };
    $("saveBtn").onclick=function(){
      var err=$("err"),m=num($("aMonthly").value),d=$("aDay").value;
      err.textContent="";
      if(!addCat){err.textContent=T("pickCat");return;}
      if(!m){err.textContent=T("errMonthly");return;}
      var dd=d===""?null:parseInt(d,10);
      if(dd!==null&&!(dd>=1&&dd<=31)){err.textContent=T("errDay");return;}
      S.items.push({cat:addCat,provider:addProvider,item:$("aName").value.trim(),monthly:m,monthsLeft:parseInt($("aMonths").value,10)||0,dueDay:dd});
      save();go(returnTo);
    };
  };

  // Buy check
  var buyDraft={price:"",n:3,fee:"",showFee:false};
  V.buy=function(){
    return '<button class="back" id="backTop" type="button">'+esc(T("homeBtn"))+'</button><h2>'+esc(T("buyTitle"))+'</h2>'+
      moneyField("bPrice",T("price"),buyDraft.price,"1200")+
      '<label class="lb">'+esc(T("payOver"))+'</label><div class="chips" id="nChips">'+
      [3,6,12,24].map(function(n){return '<button type="button" data-n="'+n+'" class="'+(buyDraft.n===n?"on":"")+'">'+n+'</button>';}).join("")+'</div>'+
      '<button class="link" id="feeLink" type="button" style="margin-left:0;text-align:left">'+esc(T("extraLink"))+'</button>'+
      '<div id="feeBox" class="'+(buyDraft.showFee?"":"hidden")+'">'+moneyField("bFee",T("extraLbl"),buyDraft.fee,"0")+'</div>'+
      '<div id="buyOut" style="margin-top:16px"></div>';
  };
  W.buy=function(){
    $("backTop").onclick=function(){go("home");};
    $("bPrice").oninput=function(){buyDraft.price=this.value;updBuy();};
    $("bFee").oninput=function(){buyDraft.fee=this.value;updBuy();};
    $("feeLink").onclick=function(){buyDraft.showFee=true;$("feeBox").classList.remove("hidden");};
    $("nChips").querySelectorAll("button").forEach(function(b){
      b.onclick=function(){
        buyDraft.n=parseInt(b.getAttribute("data-n"),10);
        $("nChips").querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b);});
        updBuy();
      };
    });
    updBuy();
  };
  function updBuy(){
    var out=$("buyOut"),price=num(buyDraft.price);
    if(!price){out.innerHTML='<div class="empty">'+esc(T("enterPrice"))+'</div>';return;}
    var n=buyDraft.n,fee=num(buyDraft.fee),mo=(price+fee)/n,c=calc(mo),cls,vt,vs;
    if(c.safe<0){cls="red";vt=T("vShortT");vs=T("vShortS",{x:fmt(-c.safe)});}
    else if(c.band==="red"){cls="red";vt=T("vTooT");vs=T("vTooS",{p:pctTxt(c.pct)});}
    else if(c.band==="amber"){cls="amber";vt=T("vCarT");vs=T("vCarS",{p:pctTxt(c.pct),a:AMBER_PCT});}
    else{cls="green";vt=T("vOkT");vs=T("vOkS",{p:pctTxt(c.pct)});}
    out.innerHTML=
      '<div class="card"><div class="bigl">'+esc(T("youPay"))+'</div><div class="bign">'+esc(fmt(mo))+'</div>'+
      '<div class="hint">'+esc(T("eachMonth"))+' '+n+' '+esc(T("months"))+(c.safe>=0?'. '+esc(T("stillLeft",{x:fmt(c.safe)})):'')+'</div></div>'+
      '<div class="verdict '+cls+'"><div class="vt">'+esc(vt)+'</div><div class="vs">'+esc(vs)+'</div>'+gauge(c.pct)+'</div>'+
      '<div class="hint" style="margin-bottom:6px">'+esc(T("youDecide"))+'</div>'+
      '<button class="second" id="buyIt" type="button">'+esc(T("buyIt"))+'</button>';
    $("buyIt").onclick=function(){
      addPrefill={monthly:Math.round(mo*100)/100,months:n};
      returnTo="home";go("add");
    };
  }

  // Help
  V.help=function(){
    return '<button class="back" id="backTop" type="button">'+esc(T("homeBtn"))+'</button><h2>'+esc(T("helpTitle"))+'</h2>'+
      '<div class="card"><p>'+esc(T("helpBody"))+'</p><p><a href="https://www.akpk.org.my" target="_blank" rel="noopener noreferrer">akpk.org.my</a></p><div class="hint">'+esc(T("helpVerify"))+'</div></div>'+
      '<div class="card soft"><div class="sec">'+esc(T("signsTitle"))+'</div><ul class="signs">'+T("signs").map(function(s){return '<li>'+esc(s)+'</li>';}).join("")+'</ul></div>';
  };
  W.help=function(){$("backTop").onclick=function(){go(S.setupDone?"home":"welcome");};};

  // Paste parser (best effort)
  function parseText(txt){
    var out={},m=txt.match(/RM\s?([\d,]+(?:\.\d{1,2})?)/i);
    if(m)out.monthly=parseFloat(m[1].replace(/,/g,""));
    var day=null,d=txt.match(/\b(\d{1,2})\s*(jan|feb|mar|apr|may|mei|jun|jul|aug|ogos|sep|oct|okt|nov|dec|dis)[a-z]*/i);
    if(d)day=parseInt(d[1],10);
    else{var s=txt.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-]\d{2,4})?\b/);if(s)day=parseInt(s[1],10);}
    if(day&&day>=1&&day<=31)out.dueDay=day;
    var low=txt.toLowerCase();
    for(var i=0;i<PARSE_NAMES.length;i++){if(low.indexOf(PARSE_NAMES[i][0])>-1){out.provider=PARSE_NAMES[i][1];break;}}
    return out;
  }

  // Flow
  function finishSetup(){REAL.setupDone=true;save();go("home");}
  function startDemo(){S=JSON.parse(JSON.stringify(DEMO_DATA));go("home");}
  function exitDemo(){S=REAL;go(REAL.setupDone?"home":"w1");}
  var hist=["welcome"], hi=0;
  function go(v){
    if(v!==hist[hi]){hist=hist.slice(0,hi+1);hist.push(v);if(hist.length>60)hist.shift();hi=hist.length-1;}
    view=v;render();window.scrollTo(0,0);
  }
  function stepNav(d){var n=hi+d;if(n<0||n>=hist.length)return;hi=n;view=hist[hi];render();window.scrollTo(0,0);}
  function navBar(){
    return '<div class="gnav"><button class="arrow" id="gBack" type="button" aria-label="'+esc(T("backAria"))+'"'+(hi<=0?' disabled':'')+'>&#8592;</button>'+
      '<button class="arrow" id="gFwd" type="button" aria-label="'+esc(T("fwdAria"))+'"'+(hi>=hist.length-1?' disabled':'')+'>&#8594;</button></div>';
  }

  function render(){
    $("lEN").classList.toggle("on",REAL.lang==="en");
    $("lMS").classList.toggle("on",REAL.lang==="ms");
    document.documentElement.lang=REAL.lang==="ms"?"ms":"en";
    var banner=$("demoBanner");
    if(inDemo()){
      banner.classList.remove("hidden");
      banner.innerHTML=esc(T("exampleBanner"))+'<button type="button" id="exitDemo">'+esc(T("startOwn"))+'</button>';
      $("exitDemo").onclick=exitDemo;
    }else{banner.classList.add("hidden");banner.innerHTML="";}
    $("app").innerHTML=navBar()+V[view]();
    $("gBack").onclick=function(){stepNav(-1);};
    $("gFwd").onclick=function(){stepNav(1);};
    W[view]();
    $("foot").textContent=T("disclaimer");
  }

  $("lEN").onclick=function(){REAL.lang="en";save();render();};
  $("lMS").onclick=function(){REAL.lang="ms";save();render();};

  render();
})();
</script>
</body>
</html>
