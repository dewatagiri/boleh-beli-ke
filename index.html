.demo button{display:block;margin-top:8px;border:0;background:var(--amber-btn);color:#fff;border-radius:10px;padding:0 14px;min-height:44px;font-size:0.882rem;font-weight:800;}

p{margin:0 0 12px;}

.soft{background:var(--soft);box-shadow:none;}

.verdict.amber{background:linear-gradient(180deg,var(--amber-bg),var(--amber-bg2));}
.verdict.red{background:linear-gradient(180deg,var(--red-bg),var(--red-bg2));}

.verdict .vs{font-size:1rem;margin-top:8px;color:var(--ink);}
.gauge{width:100%;max-width:300px;margin:6px auto 0;display:block;}
.gs{stroke:var(--z-safe);} .gc{stroke:var(--z-care);} .gb{stroke:var(--z-bad);}

.hidden{display:none !important;}

  function T(k,v){
    var L=I18N[REAL.lang]||I18N.en, s=L[k]!==undefined?L[k]:I18N.en[k];
    if(v&&typeof s==="string"){Object.keys(v).forEach(function(x){s=s.split("{"+x+"}").join(v[x]);});}
    return s;
  }
  function catName(id){return T("c_"+catOf(id).id);}

  // ---- Maths
  function essTotal(s){var e=s.ess||{};return num(e.rent)+num(e.food)+num(e.transport)+num(e.bills)+num(e.other);}
  function calc(extra){
    var load=0;S.items.forEach(function(i){load+=num(i.monthly);});load+=extra||0;
    var income=num(S.income), ess=essTotal(S);
    var pct=income>0?(load/income)*100:(load>0?999:0);
    var safe=income-ess-load;
    var band=(safe<0||pct>=RED_PCT)?"red":(pct>=AMBER_PCT?"amber":"green");
    return {load:load,income:income,ess:ess,pct:pct,safe:safe,band:band};
  }
  function pctTxt(p){return p>=999?"100+":String(Math.round(p*10)/10);}
  function byCat(){
    var m={},list=[];
    S.items.forEach(function(i){var k=catOf(i.cat).id;if(!m[k]){m[k]={id:k,total:0,items:[]};list.push(m[k]);}m[k].total+=num(i.monthly);m[k].items.push(i);});
    list.sort(function(a,b){return b.total-a.total;});
    return list;
  }

  // ---- Charts
  function gauge(pct){
    var cx=100,cy=100,r=78,sw=18;
    function pt(p,rad){var a=Math.PI*(1-p/50);return [cx+rad*Math.cos(a),cy-rad*Math.sin(a)];}
    function arc(p1,p2,cls){var a=pt(p1,r),b=pt(p2,r);
      return '<path class="'+cls+'" d="M'+a[0].toFixed(2)+' '+a[1].toFixed(2)+' A'+r+' '+r+' 0 0 1 '+b[0].toFixed(2)+' '+b[1].toFixed(2)+'" fill="none" stroke-width="'+sw+'"/>';}
    var p=Math.min(Math.max(pct,0),50), tip=pt(p,r-8);
    var svg='<svg class="gauge" viewBox="0 0 200 132" role="img" aria-label="'+esc(T("gaugeAria",{p:pctTxt(pct)}))+'">'+
      arc(0,AMBER_PCT,"gs")+arc(AMBER_PCT,RED_PCT,"gc")+arc(RED_PCT,50,"gb")+
      '<line class="gn" x1="'+cx+'" y1="'+cy+'" x2="'+tip[0].toFixed(2)+'" y2="'+tip[1].toFixed(2)+'" stroke-width="5" stroke-linecap="round"/>'+
      '<circle class="gh" cx="'+cx+'" cy="'+cy+'" r="8"/>'+
      '<text class="gt" x="18" y="119" font-size="11" font-weight="700">0%</text>'+
      '<text class="gt" x="182" y="119" font-size="11" font-weight="700" text-anchor="end">50%+</text>'+
      '<text class="gv" x="100" y="128" font-size="19" font-weight="800" text-anchor="middle">'+esc(pctTxt(pct))+'%</text></svg>';
    var lg='<div class="gl"><span><i class="zs"></i>'+esc(T("gSafe",{a:AMBER_PCT}))+'</span><span><i class="zc"></i>'+esc(T("gCare",{a:AMBER_PCT,r:RED_PCT}))+'</span><span><i class="zb"></i>'+esc(T("gToo",{r:RED_PCT}))+'</span></div>';
    return svg+lg;
  }
  function donut(segs,label){
    var total=0;segs.forEach(function(s){total+=Math.max(s.v,0);});
    var R=15.91549,off=25,h='<svg class="donut" viewBox="0 0 42 42" role="img" aria-label="'+esc(label)+'"><circle class="dt" cx="21" cy="21" r="'+R+'" fill="none" stroke-width="6"/>';
    if(total>0){segs.forEach(function(s){
      if(s.v<=0)return;var len=s.v/total*100;
      h+='<circle cx="21" cy="21" r="'+R+'" fill="none" style="stroke:'+s.c+'" stroke-width="6" stroke-dasharray="'+len.toFixed(3)+' '+(100-len).toFixed(3)+'" stroke-dashoffset="'+off.toFixed(3)+'"/>';
      off-=len;});}
    return h+'</svg>';
  }
  function stackBar(groups){
    var total=0;groups.forEach(function(g){total+=g.total;});
    if(total<=0)return '';
    return '<div class="stack" aria-hidden="true">'+groups.map(function(g){return '<span style="width:'+(g.total/total*100).toFixed(2)+'%;background:'+catOf(g.id).c+'"></span>';}).join("")+'</div>';
  }

  function nextDueDays(day){
    var now=new Date(),y=now.getFullYear(),m=now.getMonth(),d=now.getDate();
    function dim(yy,mm){return new Date(yy,mm+1,0).getDate();}
    var t=Math.min(day,dim(y,m));
    if(t<d){m+=1;if(m>11){m=0;y+=1;}t=Math.min(day,dim(y,m));}
    var a=new Date(now.getFullYear(),now.getMonth(),now.getDate()),b=new Date(y,m,t);
    return Math.round((b-a)/86400000);
  }

  function parseText(txt){
    var out={},m=txt.match(/RM\s?([\d,]+(?:\.\d{1,2})?)/i);
    if(m)out.monthly=parseFloat(m[1].replace(/,/g,""));
    var day=null,d=txt.match(/\b(\d{1,2})\s*(jan|feb|mar|apr|may|mei|jun|jul|aug|ogos|sep|oct|okt|nov|dec|dis)[a-z]*/i);

    else{var s=txt.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-]\d{2,4})?\b/);if(s)day=parseInt(s[1],10);}
    if(day&&day>=1&&day<=31)out.dueDay=day;
    var low=txt.toLowerCase();
    for(var i=0;i<PARSE_NAMES.length;i++){if(low.indexOf(PARSE_NAMES[i][0])>-1){out.provider=PARSE_NAMES[i][1];break;}}
    return out;
  }

  // Navigation uses the browser history, so iOS swipe-back and the Android back button stay inside the app.
  var stack=["welcome"], pos=0, hasHist=true;
  var TABVIEWS={home:1,plans:1,buy:1,help:1};
  function writeHist(push){
    if(!hasHist)return;
    try{if(push)history.pushState({p:pos},"");else history.replaceState({p:pos},"");}catch(e){hasHist=false;}
  }
  function focusTop(){
    var h=$("app").querySelector("h1,h2");
    if(h){h.setAttribute("tabindex","-1");try{h.focus({preventScroll:true});}catch(e){}}
  }
  function shown(){hideToast();render();window.scrollTo(0,0);focusTop();}
  function go(v,replace){
    if(replace){stack[pos]=v;writeHist(false);}
    else if(v!==stack[pos]){pos++;stack=stack.slice(0,pos);stack.push(v);writeHist(true);}
    view=v;shown();
  }
  function back(fallback){
    if(pos>0){
      if(hasHist){history.back();}
      else{pos--;view=stack[pos];shown();}
    }else go(fallback,true);
  }
  // Go to t: step back if it is the previous screen, otherwise replace this one.
  function leave(t){if(pos>0&&stack[pos-1]===t)back(t);else go(t,true);}
  function tabTo(v){if(v!==view)leave(v);}
  window.addEventListener("popstate",function(e){
    var p=e.state&&typeof e.state.p==="number"?e.state.p:0;
    if(!stack[p])stack[p]="welcome";
    pos=p;view=stack[p];shown();
  });
  writeHist(false);

  // Remove: ask "are you sure?" first, then delete and refresh the screen
  var toastT=null, modalPrev=null;
  function hideToast(){clearTimeout(toastT);var t=$("toast");if(t){t.classList.add("hidden");t.textContent="";}}
  function showDone(msg){var t=$("toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(toastT);toastT=setTimeout(hideToast,3500);}
  function modalKeys(e){
    if(e.key==="Escape"){e.preventDefault();closeConfirm();return;}
    if(e.key==="Tab"){
      e.preventDefault();
      var no=$("cfNo"),yes=$("cfYes");
      (document.activeElement===no?yes:no).focus();
    }
  }
  function closeConfirm(){
    var m=$("confirmBg");if(!m)return;
    m.parentNode.removeChild(m);
    document.removeEventListener("keydown",modalKeys,true);
    var w=document.querySelector(".wrap");if(w)w.removeAttribute("aria-hidden");
    if(modalPrev&&document.body.contains(modalPrev))modalPrev.focus();
    modalPrev=null;
  }
  function confirmRemove(idx,opener){
    var it=S.items[idx];if(!it)return;
    closeConfirm();
    modalPrev=opener||null;
    var name=it.item||catName(it.cat);
    var m=document.createElement("div");m.id="confirmBg";m.className="modal-bg";
    m.innerHTML='<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="cfT" aria-describedby="cfB">'+
      '<h2 id="cfT">'+esc(T("confirmTitle"))+'</h2><p id="cfB">'+esc(T("confirmBody",{n:name,x:fmt(num(it.monthly))}))+'</p>'+
      '<button class="danger" id="cfYes" type="button">'+esc(T("remove"))+'</button>'+
      '<button class="second" id="cfNo" type="button">'+esc(T("cancel"))+'</button></div>';
    document.body.appendChild(m);
    var w=document.querySelector(".wrap");if(w)w.setAttribute("aria-hidden","true");
    $("cfNo").onclick=closeConfirm;
    m.onclick=function(e){if(e.target===m)closeConfirm();};
    $("cfYes").onclick=function(){
      var i=S.items.indexOf(it);
      closeConfirm();
      if(i>-1){S.items.splice(i,1);save();}
      render();focusTop();
      showDone(T("removed")+": "+name);
    };
    document.addEventListener("keydown",modalKeys,true);
    $("cfNo").focus();
  }

  function render(){
    if(view==="welcome"&&inDemo())S=REAL;
    var en=REAL.lang==="en";
    $("lEN").classList.toggle("on",en);$("lEN").setAttribute("aria-pressed",en?"true":"false");
    $("lMS").classList.toggle("on",!en);$("lMS").setAttribute("aria-pressed",en?"false":"true");
    document.documentElement.lang=REAL.lang==="ms"?"ms":"en";
    var banner=$("demoBanner");
    if(inDemo()){
      banner.classList.remove("hidden");
      banner.innerHTML=esc(T("exampleBanner"))+'<button type="button" id="exitDemo">'+esc(T("startOwn"))+'</button>';
      $("exitDemo").onclick=exitDemo;
    }else{banner.classList.add("hidden");banner.innerHTML="";}
    updNotice();
    $("app").innerHTML=V[view]();
    W[view]();
    var showTabs=!!TABVIEWS[view]&&!!S.setupDone, tb=$("tabs");
    document.body.classList.toggle("has-tabs",showTabs);
    tb.classList.toggle("hidden",!showTabs);
    if(showTabs){
      tb.setAttribute("aria-label",T("tabsAria"));
      tb.innerHTML='<div class="in">'+[["home","🏠","tabHome"],["plans","📋","tabPlans"],["buy","🛒","tabBuy"],["help","🤝","tabHelp"]].map(function(t){
        return '<button type="button" data-t="'+t[0]+'"'+(view===t[0]?' aria-current="page"':'')+'><span class="ic" aria-hidden="true">'+t[1]+'</span><span>'+esc(T(t[2]))+'</span></button>';}).join("")+'</div>';
      tb.querySelectorAll("button").forEach(function(b){b.onclick=function(){tabTo(b.getAttribute("data-t"));};});
    }
    $("foot").textContent=T("disclaimer");
  }

  $("lEN").onclick=function(){REAL.lang="en";save();render();};
  $("lMS").onclick=function(){REAL.lang="ms";save();render();};

  render();
})();
</script>
</body>
</html>
